name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build site
        run: python3 scripts/build_site.py

      # Root-relative URLs only work once Pages serves this repo at vidfare.com.
      # Publishing before that points /style.css at the user site, not this project.
      - name: Confirm Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq .cname)
          echo "Pages cname: ${cname:-<unset>}"
          if [ "$cname" != "vidfare.com" ]; then
            echo "::error::Refusing to publish until the Pages custom domain is vidfare.com. In Settings → Pages, set Custom domain to vidfare.com and save, then re-run this workflow. Enforce HTTPS after the certificate is ready."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Submits every sitemap URL, including the guides. A non-2xx IndexNow response warns and does not fail the deploy.
      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        run: python3 scripts/notify_indexnow.py
