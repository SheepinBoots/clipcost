name: Schedule probe

# Temporary registration check. Confirms GitHub creates a schedule event for a
# workflow that is not the Pages deploy. Removed after the 14:47 UTC slot
# on 2026-10-22.
on:
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Record that the schedule fired
        run: echo "schedule probe fired at $(date -u +%Y-%m-%dT%H:%M:%SZ) event=${{ github.event_name }}"
